[theme]
base = "dark"
primaryColor = "#c6f432"
backgroundColor = "#08090b"
secondaryBackgroundColor = "#121418"
textColor = "#f4f5f7"
borderColor = "#23262d"
baseRadius = "0.75rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"

[theme.sidebar]
backgroundColor = "#0a0b0d"
secondaryBackgroundColor = "#121418"

[client]
toolbarMode = "minimal"

[server]
headless = true
