[theme]
base = "dark"
primaryColor = "#00e5ff"
backgroundColor = "#05070f"
secondaryBackgroundColor = "#0b1026"
textColor = "#e6ecff"
borderColor = "#1d2547"
baseRadius = "0.75rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"

[theme.sidebar]
backgroundColor = "#070a18"
secondaryBackgroundColor = "#0b1026"

[client]
toolbarMode = "minimal"

[server]
headless = true
